[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meridian-treasury"
version = "3.5.4"
description = "Meridian — enterprise AI liquidity & working-capital intelligence platform (governed agents, MCP, Claude, MongoDB Atlas)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "langgraph>=1.0",
  "anthropic>=0.40",
  "mcp>=2.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pymongo>=4.8",
  "numpy>=1.26",
  "scipy>=1.12",
  "scikit-learn>=1.5",
  "joblib>=1.4",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "prometheus-client>=0.20",
  "pyjwt>=2.8",
  "defusedxml>=0.7",
]

[project.optional-dependencies]
nlp = ["sentence-transformers>=3.0"]
vertex = ["anthropic[vertex]>=0.40"]
bedrock = ["anthropic[bedrock]>=0.40"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "mongomock>=4.1", "ruff>=0.5", "mypy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
meridian = ["data/documents/*.md", "data/market_snapshots/*.json", "console/*.html", "console/*.css",
  "console/js/*.js", "console/vendor/*"]

[project.scripts]
meridian = "meridian.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["network: live third-party requests (opt-in via MERIDIAN_NETWORK_TESTS=1)"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.ruff]
line-length = 135
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S311", "B008", "UP042", "S314", "S405"]

[tool.ruff.lint.per-file-ignores]
"src/meridian/benchmark/report.py" = ["E501"]   # HTML report template
"src/meridian/public_company/sec.py" = ["E501"]   # XBRL concept table: one concept list per line
